<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f7f6">
    <meta name="description" content="Calculate your exact age, lifetime totals, next birthday countdown, and upcoming milestones.">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container animate-fade-in">
        <header>
            <h1>Age Calculator</h1>
            <button id="themeToggle" class="toggle-btn" type="button" aria-label="Switch to dark mode" aria-pressed="false">🌙 Dark Mode</button>
        </header>
        <main>
            <form id="ageForm" class="input-section">
                <label for="dob">Enter your date of birth</label>
                <input type="date" id="dob" name="dob" required autocomplete="bday" aria-describedby="dobError">
                <p id="dobError" class="error-message" role="alert" hidden></p>
                <button id="calculateBtn" type="submit">Calculate Age</button>
            </form>
            <div id="wishBanner" class="wish-banner" role="status" aria-live="polite" hidden></div>
            <section id="results" class="results-section" aria-label="Age calculation results" hidden>
                <article class="card">
                    <h2>⏳ Exact Age</h2>
                    <p id="exactAge">--</p>
                </article>
                <article class="card">
                    <h2>📊 Lifetime Totals</h2>
                    <p><strong>Total Months:</strong> <span id="totalMonths">--</span></p>
                    <p><strong>Total Days:</strong> <span id="totalDays">--</span></p>
                </article>
                <article class="card">
                    <h2>📅 Birth Day of the Week</h2>
                    <p id="birthDayOfWeek">--</p>
                </article>
                <article class="card">
                    <h2>🎉 Next Birthday Countdown</h2>
                    <p><strong>Day of the Week:</strong> <span id="nextBirthdayDay">--</span></p>
                    <div id="countdownClock" class="countdown-clock" aria-label="Time until next birthday" aria-live="off">
                        <div class="countdown-unit"><span id="cdDays" class="countdown-value">00</span><span class="countdown-label">Days</span></div>
                        <div class="countdown-unit"><span id="cdHours" class="countdown-value">00</span><span class="countdown-label">Hours</span></div>
                        <div class="countdown-unit"><span id="cdMinutes" class="countdown-value">00</span><span class="countdown-label">Minutes</span></div>
                        <div class="countdown-unit"><span id="cdSeconds" class="countdown-value">00</span><span class="countdown-label">Seconds</span></div>
                    </div>
                </article>
                <article class="card">
                    <h2>🚀 Upcoming Age Milestones</h2>
                    <ul id="milestonesList" class="milestones-list"></ul>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
